<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== APP HEADER ===== -->
    <header class="app-header">
      <h1>Expense & Budget Visualizer</h1>

      <!-- Dark/Light Mode Toggle -->
      <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode">
        🌙 Dark Mode
      </button>
    </header>

    <main class="app-main">

      <!-- ===== TOTAL BALANCE ===== -->
      <section class="section-balance" aria-label="Total balance">
        <h2>Total Spending</h2>
        <p id="total-balance">Rp 0</p>
      </section>

      <!-- ===== SPENDING LIMIT ===== -->
      <section class="section-limit" aria-label="Spending limit">
        <h2>Spending Limit</h2>
        <div class="limit-controls">
          <label for="budget-limit">Set Limit (Rp)</label>
          <input
            type="number"
            id="budget-limit"
            name="budget-limit"
            placeholder="e.g. 500000"
            min="0"
          />
          <button type="button" id="set-limit-btn">Set Limit</button>
        </div>
        <p id="limit-status" aria-live="polite"></p>
      </section>

      <!-- ===== ADD TRANSACTION FORM ===== -->
      <section class="section-form" aria-label="Add transaction">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Lunch"
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="e.g. 25000"
              min="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
          </div>

          <button type="submit" id="add-btn">Add Transaction</button>

        </form>
      </section>

      <!-- ===== TRANSACTION LIST ===== -->
      <section class="section-list" aria-label="Transaction list">
        <div class="list-header">
          <h2>Transactions</h2>

          <!-- Sort Controls -->
          <div class="sort-controls">
            <label for="sort-by">Sort by</label>
            <select id="sort-by" name="sort-by">
              <option value="default">Default (newest)</option>
              <option value="oldest">Oldest</option>
              <option value="amount-asc">Amount: Low → High</option>
              <option value="amount-desc">Amount: High → Low</option>
              <option value="category">Category: A → Z</option>
            </select>
          </div>
        </div>

        <!-- Transaction items are injected here by JavaScript -->
        <ul id="transaction-list" aria-live="polite" aria-label="List of transactions">
          <!-- Empty state shown when no transactions exist -->
          <li id="empty-state" class="empty-state">No transactions yet. Add one above!</li>
        </ul>
      </section>

      <!-- ===== SPENDING DISTRIBUTION CHART ===== -->
      <section class="section-chart" aria-label="Spending distribution chart">
        <h2>Spending Distribution</h2>
        <div class="chart-container">
          <canvas id="spending-chart" aria-label="Pie chart showing spending by category" role="img"></canvas>
        </div>
        <p id="chart-empty-state" class="empty-state">Add transactions to see the chart.</p>
      </section>

    </main>

    <footer class="app-footer">
      <p>Expense &amp; Budget Visualizer</p>
    </footer>

    <!-- Chart.js CDN (loaded before app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- App logic -->
    <script src="js/app.js"></script>

  </body>
</html>
